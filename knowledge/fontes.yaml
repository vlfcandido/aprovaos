  url_lista: "índice por base — https://portal.stf.jus.br/jurisprudencia/sumariosumulas.asp?base=30 (súmulas comuns) e ?base=26 (vinculantes); cada item do índice é `sumariosumulas.asp?base=<base>&sumula=<id-interno>` — o `<id-interno>` não é o número da súmula, precisa resolver pelo texto do link antes de montar a URL da súmula individual (`dominio.sumula.resolver_id_interno_stf`)"
  formato: html
  o_que_publica: [sumula]
  identidade_do_item: "`<id-interno>` da URL (não muda entre coletas); não há varredura de novidade nesta fatia — as súmulas pedidas são escolhidas por quem monta a receita do dossiê (`motor/dossie.py::RECEITAS`), não descobertas por polling"
  robots_txt: "permite (lido em 19/09/2026: `GET https://portal.stf.jus.br/robots.txt` → `Disallow: /processos` só; `/jurisprudencia/sumariosumulas.asp` não está bloqueado)"
