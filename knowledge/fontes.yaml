    user_agent: "Mozilla/5.0 (compatible; AprovaOS-coletor/0.1; +contato: vlfcandido@gmail.com) (ADR-0037 — sem UA de navegador/híbrido, o STF devolve 403 nas páginas de súmula, medido em `.superpowers/sdd/V3b-multipla-escolha/fontes-juridicas-report.md`)"
