<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 512" width="100%" role="img" aria-labelledby="claro-aprovaos-largo-t claro-aprovaos-largo-d" preserveAspectRatio="xMidYMid meet" style="display:block;max-width:100%;height:auto"><title id="claro-aprovaos-largo-t">Do edital ao plano do dia, com o porquê de cada escolha</title><desc id="claro-aprovaos-largo-d">O agente analista lê o edital e as provas e monta o DNA do concurso, com uma regra fixa de reserva se a IA falhar. Regras geram as opções de estudo e a IA escolhe e escreve o porquê de cada bloco do plano do dia. Questão e aula só chegam ao aluno depois de validadas, com a fonte. A previsão de nota sai com margem de erro por matéria, e cada resposta reagenda a revisão.</desc><defs><marker id="claro-aprovaos-largo-pm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5L8.5 5L1.5 8.5" fill="none" stroke="#0d5f73" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="claro-aprovaos-largo-pc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5L8.5 5L1.5 8.5" fill="none" stroke="#e8445f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#f2f5f3"/><g aria-hidden="true"><path d="M770 522C770 438 848 408 902 414C962 420 1010 468 1010 522" fill="none" stroke="#bccdce" stroke-width="1.2" opacity="0.8"/><path d="M808.4 522C808.4 464.88 861.44 444.48 898.16 448.56C938.96 452.64 971.6 485.28 971.6 522" fill="none" stroke="#bccdce" stroke-width="1.2" opacity="0.8"/><path d="M844.4 522C844.4 490.08 874.04 478.68 894.56 480.96C917.36 483.24 935.6 501.48 935.6 522" fill="none" stroke="#bccdce" stroke-width="1.2" opacity="0.8"/><text x="884" y="508" font-family="'Brygada 1918', Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#486169" opacity="0.8">18</text></g><text x="46" y="39" font-family="'Brygada 1918', Georgia, 'Times New Roman', serif" font-style="italic" font-size="21" font-weight="600" fill="#c4213f">1</text><text x="72" y="38" font-family="'Brygada 1918', Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#486169"><tspan x="72" dy="0">lê</tspan></text><rect x="50" y="59" width="252" height="68" rx="26" fill="#bccdce"/><rect x="46" y="55" width="252" height="68" rx="26" fill="#ffffff" stroke="#bccdce" stroke-width="1.4"/><text x="65" y="82" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="650" fill="#0f2a33"><tspan x="65" dy="0">Edital e provas</tspan></text><text x="65" y="106" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14.5" fill="#486169"><tspan x="65" dy="0">o PDF da banca</tspan></text><text x="354" y="39" font-family="'Brygada 1918', Georgia, 'Times New Roman', serif" font-style="italic" font-size="21" font-weight="600" fill="#c4213f">2</text><text x="380" y="38" font-family="'Brygada 1918', Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#486169"><tspan x="380" dy="0">entende a prova</tspan></text><rect x="358" y="59" width="252" height="87" rx="12" fill="#bccdce"/><rect x="354" y="55" width="252" height="87" rx="12" fill="#dcebec" stroke="#0d5f73" stroke-width="2"/><text x="367" y="82" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="650" fill="#0f2a33"><tspan x="367" dy="0">DNA do concurso</tspan></text><text x="367" y="106" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14.5" fill="#486169"><tspan x="367" dy="0">agente analista; se a IA</tspan><tspan x="367" dy="19">falha, regra fixa</tspan></text><circle cx="592" cy="70" r="4.5" fill="#e8445f"/><text x="662" y="39" font-family="'Brygada 1918', Georgia, 'Times New Roman', serif" font-style="italic" font-size="21" font-weight="600" fill="#c4213f">3</text><text x="688" y="38" font-family="'Brygada 1918', Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#486169"><tspan x="688" dy="0">monta o dia</tspan></text><rect x="666" y="59" width="252" height="87" rx="12" fill="#bccdce"/><rect x="662" y="55" width="252" height="87" rx="12" fill="#ffffff" stroke="#bccdce" stroke-width="1.4"/><text x="675" y="82" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="650" fill="#0f2a33"><tspan x="675" dy="0">Plano do dia</tspan></text><text x="675" y="106" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14.5" fill="#486169"><tspan x="675" dy="0">regras dão as opções; a IA</tspan><tspan x="675" dy="19">escolhe e diz o porquê</tspan></text><text x="46" y="217" font-family="'Brygada 1918', Georgia, 'Times New Roman', serif" font-style="italic" font-size="21" font-weight="600" fill="#c4213f">4</text><text x="72" y="216" font-family="'Brygada 1918', Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#486169"><tspan x="72" dy="0">confere antes</tspan></text><rect x="50" y="237" width="252" height="106" rx="12" fill="#bccdce"/><rect x="46" y="233" width="252" height="106" rx="12" fill="#ffffff" stroke="#bccdce" stroke-width="1.4"/><text x="59" y="260" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="650" fill="#0f2a33"><tspan x="59" dy="0">Validação</tspan></text><text x="59" y="284" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14.5" fill="#486169"><tspan x="59" dy="0">questão só chega ao aluno com</tspan><tspan x="59" dy="19">fonte; a inédita passa por um</tspan><tspan x="59" dy="19">validador</tspan></text><text x="354" y="217" font-family="'Brygada 1918', Georgia, 'Times New Roman', serif" font-style="italic" font-size="21" font-weight="600" fill="#c4213f">5</text><text x="380" y="216" font-family="'Brygada 1918', Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#486169"><tspan x="380" dy="0">mede</tspan></text><rect x="358" y="237" width="252" height="87" rx="12" fill="#bccdce"/><rect x="354" y="233" width="252" height="87" rx="12" fill="#ffffff" stroke="#bccdce" stroke-width="1.4"/><text x="367" y="260" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="650" fill="#0f2a33"><tspan x="367" dy="0">Previsão com intervalo</tspan></text><text x="367" y="284" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14.5" fill="#486169"><tspan x="367" dy="0">nota provável com margem de</tspan><tspan x="367" dy="19">erro, por matéria</tspan></text><path d="M384 328V364" fill="none" stroke="#0d5f73" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#claro-aprovaos-largo-pm)"/><text x="396" y="355" font-family="'Brygada 1918', Georgia, 'Times New Roman', serif" font-style="italic" font-size="14" fill="#486169"><tspan x="396" dy="0">cada resposta reagenda</tspan></text><rect x="358" y="374" width="252" height="68" rx="12" fill="#bccdce"/><rect x="354" y="370" width="252" height="68" rx="12" fill="#ffffff" stroke="#bccdce" stroke-width="1.4"/><text x="367" y="397" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="650" fill="#0f2a33"><tspan x="367" dy="0">Revisão no dia certo</tspan></text><text x="367" y="421" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14.5" fill="#486169"><tspan x="367" dy="0">repetição espaçada</tspan></text><path d="M306 89C326 89 326 95 346 95" fill="none" stroke="#0d5f73" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#claro-aprovaos-largo-pm)"/><path d="M614 95C634 95 634 95 654 95" fill="none" stroke="#0d5f73" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#claro-aprovaos-largo-pm)"/><path d="M922 95H922Q932 95 932 105V161Q932 171 922 171H38Q28 171 28 181V263Q28 273 38 273H38" fill="none" stroke="#0d5f73" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#claro-aprovaos-largo-pm)"/><path d="M306 273C326 273 326 273 346 273" fill="none" stroke="#0d5f73" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#claro-aprovaos-largo-pm)"/><rect x="46" y="464" width="72.08500000000001" height="26" rx="13" fill="none" stroke="#bccdce" stroke-width="1.2"/><text x="57" y="481.5" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" font-weight="600" fill="#486169">FastAPI</text><rect x="126.08500000000001" y="464" width="93.55" height="26" rx="13" fill="none" stroke="#bccdce" stroke-width="1.2"/><text x="137.085" y="481.5" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" font-weight="600" fill="#486169">Google ADK</text><rect x="227.635" y="464" width="64.93" height="26" rx="13" fill="none" stroke="#bccdce" stroke-width="1.2"/><text x="238.635" y="481.5" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" font-weight="600" fill="#486169">Gemini</text><rect x="300.565" y="464" width="93.55" height="26" rx="13" fill="none" stroke="#bccdce" stroke-width="1.2"/><text x="311.565" y="481.5" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" font-weight="600" fill="#486169">PostgreSQL</text></svg>