# O que é: manifesto do backend do AprovaOS — dependências, build e configuração de ruff/mypy/pytest.
# Quando ler: ao adicionar dependência, mudar regra de lint/tipagem ou registrar marker de teste.
[project]
name = "aprovaos"
version = "0.1.0"
description = "AprovaOS — backend (FastAPI + SQLAlchemy 2.0)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0,<3",
    "alembic",
    "pydantic>=2",
    "pydantic-settings",
    "email-validator",
    "jinja2",
    "python-multipart",
    "argon2-cffi",
    "psycopg[binary]",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "httpx2>=2.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aprovaos"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"alembic/*" = ["D"]

[tool.mypy]
strict = true
files = ["aprovaos", "tests", "../scripts"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error::ResourceWarning",
    # Aviso interno do Starlette 1.6 (alias do anyio); não é código nosso.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
markers = ["postgres: exige DATABASE_URL_TEST apontando para um Postgres"]
